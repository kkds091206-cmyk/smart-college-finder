<h2>Staff Registration</h2>

<form action="/register_staff" method="post">

College Name<br>
<input name="college"><br>

Location<br>
<input name="location"><br>

District<br>
<input name="district"><br>

Contact Number<br>
<input name="contact"><br>

College Type<br>

<select name="type">
<option>Private</option>
<option>Government</option>
<option>Aided</option>
</select>

<br>

Autonomous<br>

<select name="autonomous">
<option>Autonomous</option>
<option>Not Autonomous</option>
</select>

<br>

Username<br>
<input name="username"><br>

Password<br>
<input type="password" name="password"><br><br>

<button type="submit">Register</button>

</form>
